name: spae_capacitaciones
description: Plataforma web multiplataforma para la gestión de capacitaciones SPAE.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  excel: ^4.0.6
  http: ^1.3.0
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  go_router: ^14.8.1
  intl: ^0.20.2
  supabase_flutter: ^2.15.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand_logo.png
